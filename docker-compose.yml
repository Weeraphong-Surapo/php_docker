version: '3.8'

services:
  php-app:
    build: .
    container_name: php-test-8090
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html/
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # ให้ Jenkins ใช้ Docker ของ host ได้
    restart: unless-stopped

volumes:
  jenkins_home:
